[project]
name = "PandaProxy"
dynamic = ["version"]
description = "BambuLab Multi-Service Proxy - Proxy camera, MQTT, and FTP from BambuLab printers"
requires-python = ">=3.14"

dependencies = [
    "aiomqtt>=2.0.0",
    "cryptography>=41.0.0",
    "ffmpeg-python",
    "typer",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
lint = [
    "ruff==0.16.3"
]

[project.scripts]
pandaproxy = "pandaproxy.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pandaproxy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pandaproxy"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RUF", # ruff-specific (dangling tasks, implicit Optional, etc.)
    "PERF", # performance anti-patterns
    "RET", # return statement style
    "DTZ", # datetime timezone awareness
    "ASYNC", # async correctness
    "PT", # pytest style
    "T20", # print statement detection
    "S", # bandit security
    "PTH", # pathlib usage
    "TC", # type-checking imports
    "FA", # future-annotations (`from __future__ import annotations` in every file)
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
# ARG: pytest fixtures are name-injected; RUF059: unused unpacked test helper vars;
# S101: assert is how pytest works; S104: tests verify proxy bind-all defaults;
# S105/S106/S107: hardcoded test fixture passwords.
"tests/**/*.py" = ["ARG", "RUF059", "S101", "S104", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["pandaproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30

[tool.ruff.format]
line-ending = "lf"
