services:
  pandaproxy:
    image: ghcr.io/juliendeveaux/pandaproxy:latest
    restart: unless-stopped
    cap_add:
      # Ports 322 and 990 are privileged; the image runs as non-root.
      - NET_BIND_SERVICE
    ports:
      - "8883:8883/tcp"
      - "990:990/tcp"
      - "2000-2019:2000-2019/tcp"
      - "6000:6000/tcp"
      # RTSP camera (X1/H2/P2 only) - drop on a P1S
      - "322:322/tcp"
    env_file: .env
    volumes:
      - ./certs:/app/certs

# To give the proxy its own LAN address instead of publishing ports on the
# host, drop the `ports:` block and attach it to a macvlan network:
