[pr_reviewer]
num_max_findings = 7
extra_instructions = """
You are reviewing a Python 3.13 asyncio network proxy for BambuLab 3D printers (MQTT, FTP, RTSP, chamber camera).
Be direct and concise. Focus on bugs, correctness, and concurrency issues.
Skip style comments — Ruff enforces formatting automatically.

Key context:
- All network I/O is async (asyncio streams, not threads).
- TLS connections use a bundled printer.cer certificate.
- Ports 322 and 990 are privileged; handled via CAP_NET_BIND_SERVICE in Docker.
- Use asyncio.to_thread(fn, *args) for blocking calls. Never get_event_loop().run_in_executor().

Focus areas:
- Resource leaks: unclosed streams, missing finally blocks for cleanup.
- Concurrency bugs: race conditions in fan-out logic, missing locks around shared state.
- TLS/SSL configuration errors.
- Error handling in proxy pass-through: partial reads, connection resets, timeouts.

=== DO NOT FLAG — INTENTIONAL PATTERNS ===

These are correct by design. Flagging any of them is a false positive.

1. `ssl.SSLContext` with `check_hostname = False` — BambuLab printers use raw IP addresses for TLS,
   making hostname verification structurally impossible. `verify_mode = ssl.CERT_REQUIRED` with the
   bundled CA bundle still enforces cert trust. Do NOT flag check_hostname=False as a security issue.

2. `asyncio.gather(*tasks, return_exceptions=True)` — used for cleanup/cancellation fan-out where
   all tasks must be awaited even if some fail. Return values are intentionally discarded.
   Do NOT flag as "unchecked return value" or "ignored exceptions".

3. `ssl.SSLError` caught, logged, and connection dropped in proxy handlers — when a TLS error occurs
   mid-connection, logging and dropping the connection IS complete error handling for a pass-through
   proxy. The upstream/downstream pair is already disrupted. Do NOT flag as "incomplete error handling".
"""

[pr_code_suggestions]
extra_instructions = """
You are reviewing a Python 3.13 asyncio proxy for BambuLab 3D printers.
Suggest concrete, minimal fixes only. Skip style — Ruff enforces formatting automatically.

Focus on:
- Resource leaks: unclosed streams, writers not closed in finally blocks.
- Concurrency bugs: unsynchronized access to shared state in fan-out logic.
- Error handling: unhandled exceptions in async tasks that would silently terminate fan-out.
- Use asyncio.to_thread() for blocking calls — never run_in_executor().
"""
